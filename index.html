<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VOLI SMANSARI</title><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;800&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet"><style>:root{--deep:#020617;--glow:#38BDF8}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Geist',sans-serif;background:#020617;color:white}#ocean{position:fixed;inset:0;z-index:-2;background:radial-gradient(900px at 20% -10%, #0C4A6E 0%, transparent 60%),radial-gradient(700px at 90% 20%, #075985 0%, transparent 60%),#020617}#stars{position:fixed;inset:0;z-index:-1}.center{max-width:480px;margin:0 auto;padding:80px 20px 40px}.logo{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,#38BDF8,#0EA5E9);display:grid;place-items:center;font-size:24px;box-shadow:0 0 30px rgba(56,189,248,.5);margin:0 auto}h1{font-size:40px;font-weight:800;text-align:center;margin-top:18px;line-height:.95;letter-spacing:-1.5px}h1 i{font-family:'Instrument Serif';color:#7DD3FC;font-weight:400}.card{margin-top:26px;background:rgba(15,23,42,.65);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.08);border-radius:28px;padding:24px}label{font-size:10px;font-weight:700;letter-spacing:1px;opacity:.5;margin:16px 0 8px;display:block}input,select,textarea{width:100%;padding:14px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:white;outline:0}input:focus,select:focus,textarea:focus{border-color:var(--glow);background:rgba(255,255,255,.1);box-shadow:0 0 0 4px rgba(56,189,248,.15)}.chip{padding:9px 14px;border-radius:100px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);font-size:12px;cursor:pointer;margin:4px;display:inline-block;color:#94A3B8}.chip.active{background:white;color:#020617;transform:scale(1.05)}#bar{height:100%;width:0%;background:linear-gradient(90deg,#38BDF8,#0EA5E9);transition:width .6s}.progress{height:4px;background:rgba(255,255,255,.08);border-radius:10px;overflow:hidden;margin:16px 0}.btn{width:100%;margin-top:20px;padding:16px;border:0;border-radius:16px;background:white;color:#020617;font-weight:800;cursor:pointer}</style></head><body><div id="ocean"></div><canvas id="stars"></canvas><div class="center"><div class="logo">🏐</div><h1>Join Tim <br><i>SMANSARI</i> Voli</h1><p style="color:#94A3B8;text-align:center;font-size:14px;margin-top:10px">SMAN 1 Wanasari • Pendaftaran simpel</p><div class="card"><div class="progress"><div id="bar"></div></div><label>NAMA LENGKAP</label><input id="nama" placeholder="Nama lu" oninput="cek()"><label>KELAS (21 KELAS)</label><select id="kelas" onchange="cek()"><option value="">Pilih kelas</option><option>X1</option><option>X2</option><option>X3</option><option>X4</option><option>X5</option><option>X6</option><option>X7</option><option>XI1</option><option>XI2</option><option>XI3</option><option>XI4</option><option>XI5</option><option>XI6</option><option>XI7</option><option>XII1</option><option>XII2</option><option>XII3</option><option>XII4</option><option>XII5</option><option>XII6</option><option>XII7</option></select><label>POSISI</label><div><span class="chip active" onclick="pilih(this)">Bebas</span><span class="chip" onclick="pilih(this)">Spiker</span><span class="chip" onclick="pilih(this)">Setter</span><span class="chip" onclick="pilih(this)">Libero</span></div><label>NO WA</label><input id="wa" placeholder="0812..." oninput="cek()"><label>PESAN SINGKAT</label><textarea id="pesan" rows="2" placeholder="Gue mau join karena..."></textarea><button class="btn" onclick="kirim()">DAFTAR — KIRIM KE WA</button></div></div><script>const canvas=document.getElementById('stars'),ctx=canvas.getContext('2d');function rs(){canvas.width=innerWidth;canvas.height=innerHeight}rs();onresize=rs;let dots=[];for(let i=0;i<120;i++)dots.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.8+.2,a:Math.random()*.6+.2,v:Math.random()*.3+.1});function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);dots.forEach(d=>{d.y-=d.v;if(d.y<0){d.y=canvas.height;d.x=Math.random()*canvas.width}ctx.fillStyle=`rgba(125,211,252,${d.a})`;ctx.shadowBlur=8;ctx.shadowColor='#38BDF8';ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0});requestAnimationFrame(draw)}draw();let posisi='Bebas';function pilih(el){document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));el.classList.add('active');posisi=el.innerText;cek()}function cek(){let s=0;if(nama.value)s+=33;if(kelas.value)s+=33;if(wa.value)s+=34;bar.style.width=s+'%';}const NOMOR='6285799279433';function kirim(){let n=nama.value.trim(),k=kelas.value,w=wa.value.trim(),p=pesan.value;if(!n||!k||!w){alert('Isi nama, kelas, WA dulu');return}let msg=`*DAFTAR VOLI SMANSARI*%0ANama: ${encodeURIComponent(n)}%0AKelas: ${k}%0APosisi: ${posisi}%0AWA: ${w}%0APesan: ${encodeURIComponent(p||'-')}`;window.open(`https://wa.me/${NOMOR}?text=${msg}`,'_blank');}cek();</script></body></html>
